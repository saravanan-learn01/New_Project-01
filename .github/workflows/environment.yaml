name: env variable testing

on:
  push:
  
env:
  address: new-20
  
jobs:
  run-add:
    runs-on: ubuntu-latest
    
    steps:
     - name: checkout
       uses: actions/checkout@v4
       
     - name: environment variable checking
       run: echo "$address"

     - name: secret-checking
       run: echo ${{ vars.NEWBIE }}
       
     - name: meta-data-repository
       run: echo ${{ github.repository }}
       
     - name: meta-data-workflow
       run: echo ${{ github.workflow }}
       
     - name: meta-data-actor
       run: echo ${{ github.triggering_actor }}
       
